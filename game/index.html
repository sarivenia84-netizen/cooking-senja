<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dapur Senja</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1512;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    canvas {
      display: block;
      border: 4px solid #c9a962;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(201, 169, 98, 0.3),
                  inset 0 0 60px rgba(0, 0, 0, 0.5);
      background: #0d0a08;
    }
    #ui-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #f5e6c8;
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
    }
    #ui-overlay.hidden {
      display: none;
    }
    .hint {
      opacity: 0.7;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="1280" height="720"></canvas>
  <div id="ui-overlay">
    <div><strong>DAPUR SENJA</strong> — Tekan <kbd>ENTER</kbd> untuk memulai</div>
    <div class="hint">WASD: Gerak | E: Ambil/Taruh | SPASI: Potong | Q: Antar | ESC: Pause</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
